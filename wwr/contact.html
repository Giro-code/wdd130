<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Elio Diaz">
    <meta name="description"
      content="Contact White Water Rafting Dominican Republic for reservations, questions, and suggestions. We reply with trip details, safety info, and support.">

    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - White Water Rafting Dominican Republic</title>
</head>

<body>
    <header>
        <img src="images/logorrd.png" alt="logo-RRD">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>

        <div class="contact-section">
            <div class="map-container">
                <img src="images/map-placeholder.jpg" alt="Location Map">
            </div>

            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder">
                    </div>

                    <div class="form-group">
                        <label>Message Purpose</label>
                        <div class="radio-group">
                            <label for="purpose-general">
                                <input type="radio" id="purpose-general" name="purpose"
                                  value="general">
                                General Inquiry
                            </label>

                            <label for="purpose-reservation">
                                <input type="radio" id="purpose-reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>

                            <label for="purpose-website">
                                <input type="radio" id="purpose-website" name="purpose"
                                  value="website">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"
                          placeholder="Type here..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="gallery">
                <figure>
                    <img src="images/Contact/raul alejandro perez.jpg" alt="raul alejandro">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure>
                    <img src="images/Contact/yeira almonte bernandez.jpg" alt="yeira almonte">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure>
                    <img src="images/Contact/julian ramirez acosta.jpg" alt="julian ramirez">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 | White Water Rafting Dominican Republic, Elio Diaz</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="./images/fb-icon.png" alt="Facebook icon">
            </a>
            <a href="https://Linkedin.com">
                <img src="./images/linkedin-icon.png" alt="Linkedin icon">
            </a>
            <a href="https://instagram.com">
                <img src="./images/instagram-icon.png" alt="Visit our Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
