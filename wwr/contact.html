<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Elio Diaz">
    <meta name="description"
      content="Contact White Water Rafting Dominican Republic for reservations, questions, and suggestions. We reply with trip details, safety info, and support.">

    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - White Water Rafting Dominican Republic</title>
</head>

<body>
    <header>
        <img src="images/logorrd.png" alt="logo-RRD">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="company-info">
            <h1>Dominican White Water Rafting</h1>
            <p>38WP+WG Jarabacoa</p>
            <p>Corocito, Jarabacoa</p>
            <p>+1 809-449-4100</p>
            <p>info@whitewaterrd.com</p>
        </div>

        <div class="contact-section">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d60323.765638654404!2d-70.73988885136723!3d19.097328400000006!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8eb03109372372b5%3A0x4de9ce3ad2852274!2sJaraventura%20-%20Rafting%20Tubing%20Canyoning%20Senderismo!5e0!3m2!1ses-419!2sdo!4v1770673166585!5m2!1ses-419!2sdo"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email">
                    </div>

                    <div class="form-group">
                        <label>Message Purpose</label>
                        <div class="radio-group">
                            <label for="purpose-general">
                                <input type="radio" id="purpose-general" name="purpose"
                                  value="general">
                                General Inquiry
                            </label>

                            <label for="purpose-reservation">
                                <input type="radio" id="purpose-reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>

                            <label for="purpose-website">
                                <input type="radio" id="purpose-website" name="purpose"
                                  value="website">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"
                          placeholder="Type here..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="gallery">
                <figure>
                    <img src="./contact/raul-alejandro-perez.jpg" alt="raul alejandro">
                    <figcaption>Raul Alejandro Perez - OM Director</figcaption>
                </figure>

                <figure>
                    <img src="./contact/yeira-almonte-bernandez.jpg" alt="yeira almonte">
                    <figcaption>Yeira Almonte Bernandez - General Manager</figcaption>
                </figure>

                <figure>
                    <img src="./contact/julian-ramirez-acosta.jpg" alt="julian ramirez">
                    <figcaption>Julian Ramirez Acosta - CEO</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 | White Water Rafting Dominican Republic, Elio Diaz</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="./images/fb-icon.png" alt="Facebook icon">
            </a>
            <a href="https://Linkedin.com">
                <img src="./images/linkedin-icon.png" alt="Linkedin icon">
            </a>
            <a href="https://instagram.com">
                <img src="./images/instagram-icon.png" alt="Visit our Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
